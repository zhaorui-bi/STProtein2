name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[test]'
      - name: Test
        env:
          CUDA_VISIBLE_DEVICES: ''
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: python -m pytest -q
      - name: Run installed demo
        env:
          CUDA_VISIBLE_DEVICES: ''
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          python examples/make_demo.py --output demo/data
          stprotein2-train run --registry demo/data/registry.json --groups demo/data/groups.json --config configs/demo.json --query query --output demo/run --anchor-cache demo/anchors --device cpu
          stprotein2-predict export --run demo/run --output demo/bundle
          stprotein2-predict predict --bundle demo/bundle --rna demo/data/query_rna.h5ad --sample query --output demo/prediction --device cpu
