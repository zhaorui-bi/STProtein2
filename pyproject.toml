[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stprotein2"
dynamic = ["version"]
description = "Clean reference-only spatial Ridge foundation for STProtein2 research"
keywords = ["spatial transcriptomics", "protein prediction", "multi-omics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3",
  "pandas>=2.0", "anndata>=0.10", "joblib>=1.3", "threadpoolctl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
stprotein2 = "stprotein2.cli:main"

[project.urls]
Repository = "https://github.com/zhaorui-bi/STProtein2"
Issues = "https://github.com/zhaorui-bi/STProtein2/issues"

[tool.setuptools.packages.find]
include = ["stprotein2", "stprotein2.*"]

[tool.setuptools.dynamic]
version = {attr = "stprotein2.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

