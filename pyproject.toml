[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stprotein2"
version = "0.1.0.dev0"
description = "Spatial RNA-to-protein prediction with a frozen anchor and prototype-guided residual corrections"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3",
  "pandas>=2.0", "torch>=2.2", "anndata>=0.10", "joblib>=1.3", "threadpoolctl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]
partition = ["pymetis==2025.2.2", "igraph==1.0.0", "leidenalg==0.12.0"]

[project.scripts]
stprotein2 = "stprotein2.cli:main"
stprotein2-train = "stprotein2_latest_benchmark_v2.__main__:main"
stprotein2-predict = "stprotein2_deploy.__main__:main"

[project.urls]
Repository = "https://github.com/zhaorui-bi/STProtein2"
Issues = "https://github.com/zhaorui-bi/STProtein2/issues"

[tool.setuptools.packages.find]
include = ["stprotein2*"]

[tool.setuptools.package-data]
stprotein2_resources = ["docs/*.md", "scripts/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

